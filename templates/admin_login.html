<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">  
</head>
<body>

<h1>Admin Login</h1>

<form action="/admin_login" method="POST">

    <label>Username:</label><br>
    <input type="text"
           name="username"
           required><br><br>

    <label>Password:</label><br>
    <input type="password"
           name="password"
           required><br><br>

    <button type="submit">
        Login
    </button>

</form>

<br>

<a href="/">Back to Home</a>

</body>
</html>
